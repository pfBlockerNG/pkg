name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check shell sources and workflows
        run: |
          set -eu
          for file in scripts/setup-hooks.sh tests/*.sh; do
            sh -n "$file"
          done
          shellcheck scripts/setup-hooks.sh tests/*.sh
          for test in tests/*.sh; do
            echo "--- $test"
            dash "$test"
          done
